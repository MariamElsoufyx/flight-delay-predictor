[tool.poetry]
name = "flight-delay-predictor"
version = "0.1.0"
description = "Flight delay prediction: data validation, feature engineering, merging, preprocessing, and classification models (CMPS344)."
authors = ["Team 19"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2"
numpy = "^2.0"
python-dateutil = "^2.9.0"
matplotlib = "^3.8"
seaborn = "^0.13"
scikit-learn = "^1.4"
joblib = "^1.3"
xgboost = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
jupyter = "^1.0"
notebook = "^7.0"
ipykernel = "^6.29"
python-dotenv = "^1.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=src --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 0
skip_empty = true
